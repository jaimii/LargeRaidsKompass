name: "Compile"

on: [push]

permissions:
  contents: write

jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Get Minecraft Version
        run: echo "MC_VERSION=$(${{ github.workspace }}/gradlew -q getMCVersion)" >> "$GITHUB_ENV"

      - name: Get Plugin Version
        run: echo "PLUGIN_VERSION=$(${{ github.workspace }}/gradlew -q getVersion)" >> "$GITHUB_ENV"

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LargeRaids
          path: build/libs/

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MC_VERSION: ${{ env.MC_VERSION }}
          PLUGIN_VERSION: ${{ env.PLUGIN_VERSION }}
        run: |
          JAR_FILE="build/libs/LargeRaids-${PLUGIN_VERSION}.jar"
          TITLE="Plugin Download for Minecraft ${MC_VERSION}"
          if gh release view "${MC_VERSION}" >/dev/null 2>&1; then
            gh release edit "${MC_VERSION}" --title "${TITLE}"
            gh release upload "${MC_VERSION}" "${JAR_FILE}" --clobber
          else
            gh release create "${MC_VERSION}" "${JAR_FILE}" \
              --title "${TITLE}" \
              --notes "Automated build for Minecraft ${MC_VERSION} (LargeRaids v${PLUGIN_VERSION})."
          fi