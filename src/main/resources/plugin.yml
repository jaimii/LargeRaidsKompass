name: LargeRaids
version: ${version}
main: com.solarrabbit.largeraids.LargeRaids
api-version: '26.3'
authors: [SolarRabbit, ThisTestUser, JustJaimii]
description: Custom large raids with specialized illager variants and bosses.
softdepend: [PlaceholderAPI, MythicMobs]

commands:
  lregg:
    description: Gives a custom raider spawn egg to a player.
    usage: /<command> <player> <variant> [amount]
    permission: largeraids.admin.giveegg
  lrstart:
    description: Starts a large raid at a player or artificial village center.
    usage: /<command> [player|center] [name]
    permission: largeraids.start
  lrskip:
    description: Skips the current wave of a large raid.
    usage: /<command>
    permission: largeraids.skip
  lrstop:
    description: Stops an ongoing large raid.
    usage: /<command> [player|center] [name]
    permission: largeraids.stop
  lrshow:
    description: Displays the current wave of an ongoing raid.
    usage: /<command>
    permission: largeraids.show
  lrgive:
    description: Gives the raid summon item to a player.
    usage: /<command> <player> [amount]
    permission: largeraids.give
  lrreload:
    description: Reloads the LargeRaids plugin configuration.
    usage: /<command>
    permission: largeraids.reload
  lrcenters:
    description: Manages artificial village centers.
    usage: /<command> [add|remove|show|hide] [name]
    permission: largeraids.centers
  lrglow:
    description: Outlines raiders in an ongoing raid.
    usage: /<command> <seconds|toggle>
    permission: largeraids.glow
  lrattack:
    description: Adds an entity class to current raiders' attack targets.
    usage: /<command> <priority> <throughWalls> <entityClass>
    permission: largeraids.attack
  lrconfig:
    description: Configures custom spawn or target locations for an ongoing large raid.
    usage: /<command> <spawn|target> [args...]
    permission: largeraids.config
  lrmobcontrol:
    description: Commands mobs in range to pathfind to a target location.
    usage: /<command> <entityClass> <range> <clear|x y z radius navSpeed priority pathfindOnce>
    permission: largeraids.mobcontrol

permissions:
  largeraids.admin.*:
    description: Grants access to all LargeRaids admin commands.
    default: op
    children:
      largeraids.admin.giveegg: true
      largeraids.start: true
      largeraids.skip: true
      largeraids.stop: true
      largeraids.show: true
      largeraids.give: true
      largeraids.reload: true
      largeraids.centers: true
      largeraids.glow: true
      largeraids.attack: true
      largeraids.config: true
      largeraids.mobcontrol: true
  largeraids.admin.giveegg:
    default: op
  largeraids.start:
    default: op
  largeraids.skip:
    default: op
  largeraids.stop:
    default: op
  largeraids.show:
    default: true
  largeraids.give:
    default: op
  largeraids.reload:
    default: op
  largeraids.centers:
    default: op
  largeraids.glow:
    default: op
  largeraids.attack:
    default: op
  largeraids.config:
    default: op
  largeraids.mobcontrol:
    default: op